[versions]
agp = "9.3.0"
kotlin = "2.2.10"
ksp = "2.3.6"
composeBom = "2025.08.00"
activityCompose = "1.10.1"
lifecycle = "2.9.2"
room = "2.7.2"
coroutines = "1.10.2"
navigationCompose = "2.9.3"
datastore = "1.1.7"
coreKtx = "1.16.0"
glance = "1.1.1"
junit = "4.13.2"
